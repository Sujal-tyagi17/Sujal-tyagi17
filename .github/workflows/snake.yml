name: Contribution snake

# Draws a snake eating this account's contribution graph, in the portfolio's colours,
# and publishes it to the "output" branch that README.md loads from.
on:
  schedule:
    - cron: "30 0 * * *" # daily, 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff5c8a&color_dots=#161b22,#3a1d2b,#7a2a4a,#c23e6b,#ff5c8a
            dist/snake-light.svg?color_snake=#e0406c&color_dots=#ebedf0,#ffd3df,#ff9ab6,#ff6f96,#e0406c

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
