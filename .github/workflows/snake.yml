name: Contribution snake

# Draws a snake eating this account's contribution graph, in neon synthwave colours,
# and publishes it to the "output" branch that README.md loads from.
on:
  schedule:
    - cron: "30 0 * * *" # daily, 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#00f0ff&color_dots=#1a0533,#4a1066,#8c1eff,#ff2975,#ffd319
            dist/snake-light.svg?color_snake=#8c1eff&color_dots=#ebedf0,#e4ccff,#c084fc,#ff2975,#ffb000

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
