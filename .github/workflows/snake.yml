name: Contribution snake

# Draws a snake eating this account's contribution graph, in Dracula terminal colours,
# and publishes it to the "output" branch that README.md loads from.
on:
  schedule:
    - cron: "30 0 * * *" # daily, 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#50fa7b&color_dots=#282a36,#44475a,#6272a4,#bd93f9,#ff79c6
            dist/snake-light.svg?color_snake=#2fbf5a&color_dots=#ebedf0,#d9d2f7,#b79cf2,#9d6bea,#e05aa8

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
